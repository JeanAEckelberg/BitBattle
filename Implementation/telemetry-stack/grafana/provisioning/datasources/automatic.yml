# Configuration file version
apiVersion: 1

# Mark provisioned data sources for deletion if they are no longer in a provisioning file.
prune: true

# List of data sources to insert/update depending on what's
# available in the database.
datasources:
  - name: loki
    type: loki
    access: proxy
    uid: ceppczokvptdsd
    url: http://loki:3100
    jsonData:
      timeout: 60
      maxLines: 1000

  - name: jaeger
    type: jaeger
    access: proxy
    uid: beppel51orl6oc
    url: http://jaeger:16686/jaeger/ui

  - name: prometheus
    type: prometheus
    access: proxy
    uid: aeppcozk7n85cf
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      httpMethod: POST
