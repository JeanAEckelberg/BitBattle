x-default-logging: &logging
 driver: "json-file"
 options:
   max-size: "100m"
   max-file: "5"
   tag: "{{.Name}}-container|{{.ImageName}}|{{.ID}}"

services:
  # Container Management Dashboard
  # Default Username: arcane
  # Default Password: arcane-admin
  arcane:
    image: ghcr.io/getarcaneapp/arcane:latest
    container_name: arcane
    ports:
      - '3552:3552'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - arcane-data:/app/data
    environment:
      - TZ=$TZ
      - APP_URL=$APP_URL
      - PUID=$PUID
      - PGID=$PGID
      - ENCRYPTION_KEY=$ENCRYPTION_KEY
      - JWT_SECRET=$JWT_SECRET
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3552/api/health >/dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: local

  postgres:
    container_name: postgres
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: postgres -c pg_stat_statements.track=all -c config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./database-setup/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 1s
      timeout: 5s
      retries: 10
    networks:
      - db-internal
    logging: *logging

  adminer:
    image: adminer:5
    container_name: adminer
    restart: unless-stopped
    ports:
      - 8080:8080
    networks:
      - db-internal
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: local
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:master
    container_name: postgres-exporter
    restart: unless-stopped
    command:
      - "--collector.postmaster"
      - "--collector.stat_checkpointer"
    environment:
      - DATA_SOURCE_URI=postgres:5432/postgres?sslmode=disable
      - DATA_SOURCE_USER=otel
      - DATA_SOURCE_PASS=otelpassword
    networks:
      - db-internal
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m
    logging:
      driver: local
  # Defaults
  # Username: guest
  # Password: guest
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - 15672:15672
    environment:
      - RABBITMQ_CONFIG_FILE=/etc/rabbitmq/rabbitmq.conf
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    logging: *logging
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  arcane-data: {}
  pg-data: {}

networks:
  db-internal:
    driver: bridge
    internal: true